# Cloudflare Pages 配置
# 部署后需在 Dashboard → Pages → Settings → KV namespace bindings 绑定 NEKOWIKI_KV

pages_build_output_dir = "dist"
name = "nekowiki"
compatibility_date = "2025-07-31"

# KV 绑定（部署后通过 Dashboard 绑定，或运行 wrangler pages deploy 时自动读取）
# 先运行:
#   wrangler kv:namespace create "NEKOWIKI_KV"
#   wrangler kv:namespace create "NEKOWIKI_KV" --preview
# 然后将输出的 id 填入下方

[[kv_namespaces]]
binding = "NEKOWIKI_KV"
id = "your-production-kv-id"
preview_id = "your-preview-kv-id"
